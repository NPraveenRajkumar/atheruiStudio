name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The library tarball is vendored in vendor/, so a plain npm ci works
      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Initial JavaScript is within budget
        run: npm run budget

      # The numbers on the home page come from src/data/bundleStats.json; fail if it no longer matches the library
      - name: Bundle stats are current
        run: |
          npm run measure
          git diff --exit-code src/data/bundleStats.json

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Smoke and accessibility tests
        run: npm test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
